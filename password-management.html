
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Management | AIMS ERP</title>
    <link rel="stylesheet" href="password-management.css">
</head>
<body>

<header class="topbar">
    <div class="brand">
        <img src="logo.jpg" alt="AIMS Logo">
        <div>
            <h2>AIMS ERP</h2>
            <p>Password Management</p>
        </div>
    </div>
    <div class="header-actions">
        <a href="dashboard.html">← Dashboard</a>
        <button id="logoutBtn">Logout</button>
    </div>
</header>





<main class="container">
    <section class="page-heading">
        <h1>Password Management</h1>
        <p>Admin can reset Teacher, Student and Parent passwords.</p>
    </section>

    <section class="password-card">
        <label for="roleSelect">Select Account Type</label>
        <select id="roleSelect">
            <option value="teacher">Teacher</option>
            <option value="student">Student</option>
            <option value="parent">Parent</option>
        </select>

        <label for="searchInput">Search Account</label>
        <div class="search-row">
            <input type="search" id="searchInput"
                placeholder="Enter name, ID, phone or email">
            <button type="button" id="searchBtn">Search</button>
        </div>

        <label for="accountSelect">Select Account</label>
        <select id="accountSelect">
            <option value="">Search accounts first</option>
        </select>

        <label for="newPassword">Enter New Password</label>
        <input type="password" id="newPassword"
            placeholder="Minimum 8 characters" minlength="8"
            maxlength="72" autocomplete="new-password">

        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword"
            placeholder="Re-enter new password"
            autocomplete="new-password">

        <button type="button" id="resetBtn" class="reset-btn">
            Reset Password
        </button>

        <p id="message" role="status"></p>
    </section>

<section class="password-card self-password-card">
    <h2>Change My Admin Password</h2>
    <p>Verify your current password before setting a new one.</p>

    <label for="currentAdminPassword">Current Password</label>
    <input type="password" id="currentAdminPassword"
        placeholder="Enter current password"
        autocomplete="current-password">

    <label for="selfNewPassword">New Password</label>
    <input type="password" id="selfNewPassword"
        placeholder="Minimum 8 characters"
        autocomplete="new-password">

    <label for="selfConfirmPassword">Confirm New Password</label>
    <input type="password" id="selfConfirmPassword"
        placeholder="Re-enter new password"
        autocomplete="new-password">

    <button type="button" id="changeMyPasswordBtn" class="reset-btn">
        Change My Password
    </button>

    <p id="selfPasswordMessage" role="status"></p>
</section>


</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="password-management.js"></script>

</body>
</html>
