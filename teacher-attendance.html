
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIMS - Teacher Attendance</title>
    <link rel="stylesheet" href="teacher-attendance.css">
</head>
<body>

    <header class="topbar">
        <div class="brand-section">
            <img
                src="logo.jpg"
                alt="AIMS School Logo"
                class="school-logo"
            >

            <div class="brand-text">
                <h1>AIMS School ERP</h1>
                <p>Teacher Attendance Management</p>
            </div>
        </div>

        <a href="dashboard.html" class="back-btn">
            Back to Dashboard
        </a>
    </header>

    <main class="container">

        <section class="page-heading">
            <h2>Mark Teacher Attendance</h2>
            <p>Record and manage daily teacher attendance.</p>
        </section>

        <section class="attendance-card">

            <h3>Attendance Form</h3>

            <div class="attendance-form">

                <div class="form-group">
                    <label for="teacher">Select Teacher</label>
                    <select id="teacher">
                        <option value="">Loading teachers...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="attendanceDate">Attendance Date</label>
                    <input type="date" id="attendanceDate">
                </div>

                <div class="form-group">
                    <label for="status">Attendance Status</label>
                    <select id="status">
                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>
                        <option value="Late">Late</option>
                        <option value="Half Day">Half Day</option>
                        <option value="Leave">Leave</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="remarks">Remarks (Optional)</label>
                    <textarea
                        id="remarks"
                        placeholder="Enter remarks"
                    ></textarea>
                </div>

            </div>

            <button type="button" id="saveAttendance">
                Save Attendance
            </button>

            <p id="message" role="status"></p>

        </section>

        <section class="records-card">

            <h3>Teacher Attendance Records</h3>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Teacher Name</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Remarks</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="attendanceList">
                        <tr>
                            <td colspan="5">Loading records...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="teacher-attendance.js"></script>

</body>
</html>
