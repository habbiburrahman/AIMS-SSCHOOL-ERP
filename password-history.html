<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset History - AIMS ERP</title>
    <link rel="stylesheet" href="password-history.css">
    <style>
        .history-card {
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            margin: 25px auto;
            max-width: 1100px;
            box-shadow: 0 2px 12px rgba(0,0,0,.08);
        }
        .history-table-wrap { overflow-x: auto; }
        .history-table { width: 100%; border-collapse: collapse; min-width: 650px; }
        .history-table th, .history-table td {
            padding: 13px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }
        .history-table th { background: #f3f4f6; }
        #historyMessage { margin-top: 15px; }
    </style>
</head>
<body>
    <header class="topbar">
        <h2>AIMS ERP – Password Reset History</h2>
        <a href="dashboard.html">Dashboard</a>
        <button id="logoutBtn" type="button">Logout</button>
    </header>

    <main class="history-card">
        <h2>Password Reset History</h2>
        <p>Recent password reset records (latest 200).</p>

        <button id="refreshHistoryBtn" type="button">Refresh History</button>
        <p id="historyMessage" role="status">Loading history...</p>

        <div class="history-table-wrap">
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Admin</th>
                        <th>Account Name</th>
                        <th>Account Role</th>
                        <th>Date & Time</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody"></tbody>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="password-history.js"></script>
</body>
</html>
