
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance | Teacher Portal</title>

    <link rel="stylesheet" href="teacher-student-attendance.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="dashboard">

    <aside class="sidebar">
        <h2>AIMS Teacher</h2>

        <nav>
            <a href="teacher-dashboard.html">Dashboard</a>
            <a href="teacher-profile.html">My Profile</a>
            <a href="teacher-classes.html">My Classes</a>
            <a href="teacher-timetable.html">My Timetable</a>
            <a href="teacher-student-attendance.html" class="active">Student Attendance</a>
            <a href="teacher-homework.html">Homework</a>
            <a href="teacher-results.html">Student Results</a>
        </nav>

        <button id="logoutBtn">Logout</button>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <h2>Student Attendance</h2>
            <span id="teacherName">Teacher</span>
        </header>

        <section class="welcome">
            <h1>Manage Student Attendance</h1>
            <p>Mark attendance for your assigned students.</p>
        </section>

        <section class="attendance-controls">

            <div>
                <label for="classFilter">Select Class</label>
                <select id="classFilter">
                    <option value="">Select Class</option>
                </select>
            </div>

            <div>
                <label for="sectionFilter">Select Section</label>
                <select id="sectionFilter">
                    <option value="">Select Section</option>
                </select>
            </div>

            <div>
                <label for="attendanceDate">Attendance Date</label>
                <input type="date" id="attendanceDate">
            </div>

            <button id="loadStudentsBtn">Load Students</button>

        </section>

        <p id="statusMessage"></p>

        <section class="attendance-card">

            <h2>Student List</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Roll Number</th>
                            <th>Student Name</th>
                            <th>Attendance</th>
                        </tr>
                    </thead>

                    <tbody id="studentsTableBody">
                        <tr>
                            <td colspan="3">Select class, section and date.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <button id="saveAttendanceBtn">Save Attendance</button>

        </section>

    </main>

</div>

<script src="teacher-student-attendance.js"></script>

</body>
</html>
